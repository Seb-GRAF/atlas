<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Atlas — Redesign explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Warm neutral atlas palette — borrowed warmth from Airbnb, restraint from Apple */
    --atlas-bg:        #f6f3ee;
    --atlas-paper:     #ffffff;
    --atlas-paper-2:   #fbf9f5;
    --atlas-ink:       #16140f;
    --atlas-ink-2:     #4a463e;
    --atlas-ink-3:     #8a847a;
    --atlas-ink-4:     #b8b1a4;
    --atlas-line:      #ecdfd4;     /* not gray — warmer hairline */
    --atlas-line-2:    #f1e7dd;
    --atlas-soft:      #efe9e0;
    --atlas-ember:     oklch(58% 0.13 38);   /* quiet warm accent */
    --atlas-ember-2:   oklch(96% 0.03 60);
    --atlas-good:      oklch(48% 0.10 155);
    --atlas-bad:       oklch(52% 0.14 25);
    --atlas-info:      oklch(50% 0.06 230);

    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --r-pill: 999px;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
  }
  html, body {
    margin: 0;
    background: #e8e3da;
    color: var(--atlas-ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Reset some Mantine-y defaults from real components mocked here */
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  /* Helpers shared between variations */
  .mono { font-family: var(--mono); font-feature-settings: "tnum" 1, "ss01" 1; }
  .tnum { font-variant-numeric: tabular-nums; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="atlas-data.jsx"></script>
<script type="text/babel" src="atlas-icons.jsx"></script>
<script type="text/babel" src="atlas-shared.jsx"></script>
<script type="text/babel" src="v2-refined.jsx"></script>
<script type="text/babel" src="atlas-app.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
